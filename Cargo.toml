[package]
name = "gitvibe"
version = "0.3.0"
edition = "2024"
description = "A native Git desktop client built in Rust"
license = "MIT"

[dependencies]
eframe = { version = "=0.35.0", default-features = false, features = ["default_fonts", "glow", "persistence", "x11", "wayland"] }
rfd = "=0.17.2"

[profile.release]
lto = "thin"
strip = true
