[package]
name = "gitvibe"
version = "0.19.2"
edition = "2024"
description = "A native Git desktop client built in Rust"
license = "MIT"

[dependencies]
eframe = { version = "=0.35.0", default-features = false, features = ["accesskit", "default_fonts", "glow", "persistence", "x11", "wayland"] }
rfd = "=0.17.2"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
syntect = { version = "=5.3.0", default-features = false, features = ["default-fancy"] }
time = { version = "0.3", features = ["formatting"] }
ureq = "=3.4.2"

[profile.release]
lto = "thin"
strip = true
