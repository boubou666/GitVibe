[package]
name = "gitvibe"
version = "0.2.0"
edition = "2024"
description = "A native Git desktop client built in Rust"
license = "MIT"

[dependencies]
eframe = { version = "=0.35.0", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }

[profile.release]
lto = "thin"
strip = true
